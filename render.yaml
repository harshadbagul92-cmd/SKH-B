services:
  # 1. Backend Web Service (Node.js + Express + DB + Gemini AI)
  - type: web
    name: invictus-server
    runtime: node
    rootDir: gaonshiksha
    buildCommand: npm install
    startCommand: node server/index.js
    plan: free
    envVars:
      - key: PORT
        value: 5000
      - key: GEMINI_API_KEY
        sync: false

  # 2. Frontend Static Site (React + Vite + PWA)
  - type: static
    name: invictus-app
    rootDir: gaonshiksha
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: invictus-server
          property: host
